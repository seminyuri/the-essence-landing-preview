<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Суть ✕ Команда — мокап</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#7A5340;--accent-strong:#5C3D29;--accent-soft:#EADCD2;--accent-on:#fff;
  --bg:#FFFCF9;--bg-el:#FFFFFF;--bg-muted:#F5F0EA;--fg:#1A1612;--fg-muted:#5C534B;--fg-subtle:#756C64;
  --border:#E8E0D6;--border-strong:#C9BCAB;
  --success:#2F7A4F;--success-soft:#DCEFE3;--success-text:#1F6B41;
  --warning:#B17A23;--warning-soft:#F6E9C3;--warning-text:#8A5D17;
  --danger:#B7392E;--danger-soft:#F4D6D2;--danger-text:#9F2C23;
  --info:#3E6C8E;--info-soft:#DCE9F2;--info-text:#2C5678;
  --shadow-soft:0 1px 2px rgba(26,22,18,.04);--shadow-card:0 4px 16px rgba(26,22,18,.06);--shadow-pop:0 26px 64px rgba(26,22,18,.14);
  --r-sm:8px;--r-md:10px;--r-lg:12px;--r-xl:14px;--r-2xl:16px;
  --font:"Manrope",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --accent:#E8B898;--accent-strong:#F0C9AE;--accent-soft:#3A2B20;--accent-on:#0F0D08;
  --bg:#0F0D08;--bg-el:#1A1610;--bg-muted:#211C14;--fg:#F4EFE7;--fg-muted:#B5AB9D;--fg-subtle:#948A80;
  --border:#2A241C;--border-strong:#4A4135;--success-soft:#1B3A26;--success-text:#88D6AB;--warning-soft:#3A2C0E;--warning-text:#E8C271;
  --danger-soft:#3B1714;--danger-text:#F1A19A;--info-soft:#17293A;--info-text:#9CC6E6;
  --shadow-card:0 4px 16px rgba(0,0,0,.45);--shadow-pop:0 26px 70px rgba(0,0,0,.6);}}
:root[data-theme="dark"]{
  --accent:#E8B898;--accent-strong:#F0C9AE;--accent-soft:#3A2B20;--accent-on:#0F0D08;
  --bg:#0F0D08;--bg-el:#1A1610;--bg-muted:#211C14;--fg:#F4EFE7;--fg-muted:#B5AB9D;--fg-subtle:#948A80;
  --border:#2A241C;--border-strong:#4A4135;--success-soft:#1B3A26;--success-text:#88D6AB;--warning-soft:#3A2C0E;--warning-text:#E8C271;
  --danger-soft:#3B1714;--danger-text:#F1A19A;--info-soft:#17293A;--info-text:#9CC6E6;
  --shadow-card:0 4px 16px rgba(0,0,0,.45);--shadow-pop:0 26px 70px rgba(0,0,0,.6);}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
.app{display:flex;height:100vh;overflow:hidden}
/* ---------- шторка модуля ---------- */
.sidebar{width:250px;flex:none;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--bg)}
.sb-head{padding:18px 18px 10px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;letter-spacing:-.01em}
.sb-head .x{color:var(--fg-subtle);font-weight:500}
.ws{margin:4px 12px 10px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--bg-el);padding:8px 10px;display:flex;align-items:center;gap:10px;position:relative}
.ws-logo{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff}
.ws-name{font-weight:700;font-size:13px;line-height:1.2}.ws-sub{font-size:11.5px;color:var(--fg-subtle)}
.ws select{position:absolute;inset:0;opacity:0;cursor:pointer}
.search-btn{margin:0 12px 12px;display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--bg-muted);color:var(--fg-subtle);text-align:left}
.search-btn kbd{margin-left:auto;font-family:var(--mono);font-size:11px;background:var(--bg-el);border:1px solid var(--border);border-radius:5px;padding:0 5px}
.nav{padding:0 8px;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);text-decoration:none;color:var(--fg-muted);font-weight:600}
.nav a:hover{background:var(--bg-muted);color:var(--fg)}
.nav a.on{background:var(--accent-soft);color:var(--accent-strong)}
:root[data-theme="dark"] .nav a.on{color:var(--accent)}
.nav .count{margin-left:auto;font-size:11.5px;color:var(--fg-subtle);font-weight:600}
.nav-sep{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-subtle);padding:14px 10px 4px;font-weight:700}
.sb-foot{margin-top:auto;padding:12px;border-top:1px solid var(--border);font-size:12px;color:var(--fg-subtle)}
.ask-yuia{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:var(--r-md);background:linear-gradient(135deg,var(--accent-soft),transparent);border:1px solid var(--border);cursor:pointer;text-align:left;width:100%}
.ask-yuia b{display:block;color:var(--fg);font-size:12.5px}
/* ---------- рельс ---------- */
.rail{width:56px;flex:none;border-left:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:4px;background:var(--bg)}
.rail button{width:40px;height:40px;border-radius:var(--r-md);border:0;background:transparent;display:grid;place-items:center;color:var(--fg-subtle);position:relative}
.rail button:hover{background:var(--bg-muted);color:var(--fg)}
.rail button.on{background:var(--accent);color:var(--accent-on)}
.rail button.yuia{color:var(--accent)}
.rail .tip{position:absolute;right:48px;white-space:nowrap;background:var(--fg);color:var(--bg);font-size:12px;padding:3px 8px;border-radius:6px;opacity:0;pointer-events:none;transition:.15s}
.rail button:hover .tip{opacity:1}
.rail .sp{flex:1}
.avatar-me{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;background:#8C6A57}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* ---------- основное ---------- */
main{flex:1;min-width:0;overflow-y:auto}
.page{max-width:1120px;margin:0 auto;padding:28px 32px 120px}
.ph{display:flex;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.ph h1{margin:0;font-size:26px;letter-spacing:-.02em;font-weight:800}
.ph .sub{color:var(--fg-subtle);font-size:13px;margin-top:2px}
.ph .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--bg-el);font-weight:600;font-size:13px;text-decoration:none}
.btn:hover{border-color:var(--border-strong)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-on)}
.btn.primary:hover{background:var(--accent-strong)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 9px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.card{background:var(--bg-el);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--shadow-soft)}
.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.input{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--bg-el);border-radius:var(--r-md);padding:8px 10px;min-width:260px;flex:1;max-width:420px}
.input input{border:0;outline:0;background:transparent;font:inherit;color:inherit;width:100%}
.select{border:1px solid var(--border);background:var(--bg-el);border-radius:var(--r-md);padding:8px 10px;font:inherit;color:inherit}
.check{display:inline-flex;gap:7px;align-items:center;font-size:13px;color:var(--fg-muted);cursor:pointer}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-subtle);text-align:left;font-weight:700;padding:10px 14px;border-bottom:1px solid var(--border)}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer;transition:background .12s}
.tbl tbody tr:hover{background:var(--bg-muted)}
.tbl tr.left td{opacity:.55}
.who{display:flex;align-items:center;gap:10px}
.who b{font-weight:700}
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none;letter-spacing:.02em}
.muted{color:var(--fg-subtle)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--bg-muted);color:var(--fg-muted);white-space:nowrap}
.badge.warn{background:var(--warning-soft);color:var(--warning-text)}
.badge.ok{background:var(--success-soft);color:var(--success-text)}
.badge.info{background:var(--info-soft);color:var(--info-text)}
.badge.danger{background:var(--danger-soft);color:var(--danger-text)}
.badge.accent{background:var(--accent-soft);color:var(--accent-strong)}
.pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:12px 14px;color:var(--fg-subtle);font-size:12.5px;border-top:1px solid var(--border)}
/* карточка человека */
.hero{display:flex;gap:20px;align-items:center;padding:22px;flex-wrap:wrap}
.hero h1{margin:0;font-size:26px;letter-spacing:-.02em}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--bg-muted);font-size:12.5px;font-weight:600;color:var(--fg-muted);text-decoration:none;border:1px solid transparent}
a.chip:hover{border-color:var(--border-strong)}
.crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;padding:14px 22px;border-top:1px solid var(--border)}
.crumbs a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;padding:3px 8px 3px 3px;border-radius:999px;background:var(--bg-muted);font-weight:600}
.crumbs a:hover{background:var(--accent-soft)}
.crumbs .arr{color:var(--fg-subtle)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;margin-top:18px}
.sec-t{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-subtle);font-weight:800;margin:0 0 10px}
.subs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.pc{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--bg-el);text-decoration:none;transition:.12s}
.pc:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow-card)}
.pc b{display:block;font-size:13px;line-height:1.25}.pc div>span{font-size:12px;color:var(--fg-subtle)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);padding:0 14px;overflow-x:auto}
.tab{border:0;background:transparent;padding:12px 12px;font-weight:700;color:var(--fg-subtle);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tab.on{color:var(--fg);border-bottom-color:var(--accent)}
.tab .lock{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:1px 7px;border-radius:999px}
.doc-wrap{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;padding:22px}
.toc{position:sticky;top:12px;align-self:start;font-size:12.5px}
.toc a{display:block;padding:4px 8px;border-left:2px solid var(--border);text-decoration:none;color:var(--fg-muted)}
.toc a:hover{color:var(--fg);border-left-color:var(--accent)}
.meta-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--fg-subtle);padding:10px 22px;border-bottom:1px solid var(--border);background:var(--bg-muted)}
.meta-line .sp{flex:1}
.doc{font-size:15px;line-height:1.65;max-width:720px}
.doc h2{font-size:19px;margin:28px 0 8px;letter-spacing:-.01em;scroll-margin-top:12px}
.doc h2:first-child{margin-top:0}
.doc h3{font-size:16px;margin:20px 0 6px}
.doc p{margin:0 0 12px}
.doc ul,.doc ol{margin:0 0 12px;padding-left:22px}
.doc li{margin:3px 0}
.doc blockquote{margin:0 0 16px;padding:12px 16px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--r-md) var(--r-md) 0;color:var(--fg)}
.doc pre{font-family:var(--mono);font-size:12.5px;line-height:1.45;background:var(--bg-muted);border:1px solid var(--border);border-radius:var(--r-md);padding:14px 16px;overflow-x:auto;white-space:pre;margin:0 0 16px}
.doc .tw{overflow-x:auto;margin:0 0 16px;border:1px solid var(--border);border-radius:var(--r-md)}
.doc table{border-collapse:collapse;width:100%;font-size:13.5px}
.doc th,.doc td{padding:8px 12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
.doc th{background:var(--bg-muted);font-weight:700}
.doc tr:last-child td{border-bottom:0}
.empty{text-align:center;padding:48px 24px;color:var(--fg-muted)}
.empty .ill{width:64px;height:64px;border-radius:20px;background:var(--accent-soft);display:grid;place-items:center;margin:0 auto 14px;color:var(--accent)}
.empty h3{margin:0 0 6px;color:var(--fg);font-size:17px}
.empty .ex{display:inline-block;margin-top:14px;font-size:13px;background:var(--bg-muted);border:1px dashed var(--border-strong);padding:10px 14px;border-radius:var(--r-md);color:var(--fg);max-width:520px}
.side-card{padding:16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--fg-subtle)}.kv dd{margin:0;font-weight:600}
.admin-note{font-size:11.5px;color:var(--accent-strong);display:flex;gap:6px;align-items:center;margin:0 0 10px;font-weight:700}
:root[data-theme="dark"] .admin-note{color:var(--accent)}
/* дерево отделов */
.tree details{margin-left:18px;border-left:1px dashed var(--border-strong);padding-left:14px}
.tree>details{margin-left:0;border-left:0;padding-left:0}
.tree summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r-md);margin:4px 0;background:var(--bg-el);border:1px solid var(--border)}
.tree summary:hover{border-color:var(--accent)}
.tree summary::-webkit-details-marker{display:none}
.tree .chev{transition:.15s;color:var(--fg-subtle)}
.tree details[open]>summary .chev{transform:rotate(90deg)}
.tree .leaf{visibility:hidden}
.tree .dn{font-weight:700}
.tree .head{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--fg-muted)}
/* палитра, модалки, Юя */
.overlay{position:fixed;inset:0;background:rgba(26,22,18,.35);backdrop-filter:blur(2px);display:none;z-index:40}
.overlay.on{display:block}
.palette{position:fixed;top:12vh;left:50%;transform:translateX(-50%);width:min(620px,92vw);background:var(--bg-el);border:1px solid var(--border);border-radius:var(--r-2xl);box-shadow:var(--shadow-pop);z-index:50;display:none;overflow:hidden}
.palette.on{display:block}
.palette .pi{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.palette input{flex:1;border:0;outline:0;background:transparent;font:inherit;font-size:16px;color:inherit}
.palette .grp{padding:8px 16px 4px;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-subtle)}
.palette .res{display:flex;gap:10px;align-items:center;padding:8px 16px;cursor:pointer}
.palette .res.sel,.palette .res:hover{background:var(--bg-muted)}
.palette .hint{padding:10px 16px;font-size:12px;color:var(--fg-subtle);border-top:1px solid var(--border)}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(440px,100vw);background:var(--bg-el);border-left:1px solid var(--border);box-shadow:var(--shadow-pop);z-index:50;transform:translateX(105%);transition:transform .25s ease;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dr-head{display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid var(--border)}
.dr-head .yl{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#C9906F,#7A5340);display:grid;place-items:center;color:#fff}
.dr-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:10px 12px;border-radius:14px;font-size:13.5px;line-height:1.5}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-on);border-bottom-right-radius:4px}
.msg.ya{align-self:flex-start;background:var(--bg-muted);border-bottom-left-radius:4px}
.pv{border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;background:var(--bg-el)}
.pv-h{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--warning-soft);color:var(--warning-text);font-size:12px;font-weight:800;letter-spacing:.02em}
.pv-b{padding:10px 12px;font-size:13px}
.pv-b ul{margin:0;padding-left:18px}
.pv-f{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--border)}
.dr-sugs{padding:12px 16px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.sug{text-align:left;border:1px solid var(--border);background:var(--bg);border-radius:var(--r-md);padding:8px 10px;font-size:12.5px}
.sug:hover{border-color:var(--accent)}
.dr-in{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border)}
.dr-in input{flex:1;border:1px solid var(--border);border-radius:var(--r-md);padding:9px 10px;background:var(--bg);font:inherit;color:inherit}
.typing{display:inline-flex;gap:3px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--fg-subtle);animation:b 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
.modal{position:fixed;inset:4vh 0 auto;margin:auto;width:min(900px,94vw);max-height:92vh;overflow:auto;background:var(--bg-muted);border-radius:var(--r-2xl);box-shadow:var(--shadow-pop);z-index:50;display:none}
.modal.on{display:block}
.modal-h{position:sticky;top:0;display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--bg-el);border-bottom:1px solid var(--border);z-index:2}
.a4{width:min(794px,100%);margin:20px auto;background:#fff;color:#1A1612;box-shadow:0 8px 30px rgba(0,0,0,.15);padding:56px 64px 80px;position:relative;min-height:1000px}
.a4 .doc{max-width:none;font-size:13.5px}
.a4 .doc pre{background:#F5F0EA;border-color:#E8E0D6}.a4 .doc th{background:#F5F0EA}.a4 .doc blockquote{background:#F3E9E1}
.a4-head{border-bottom:2px solid #1A1612;padding-bottom:12px;margin-bottom:22px;display:flex;justify-content:space-between;gap:20px;font-size:12px}
.a4-head b{font-size:18px;display:block}
.wm{position:absolute;left:64px;right:64px;bottom:24px;font-size:11px;color:#8A7F74;border-top:1px solid #E8E0D6;padding-top:8px;display:flex;justify-content:space-between}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;transition:.25s;z-index:70;box-shadow:var(--shadow-pop);max-width:92vw}
.toast.on{opacity:1;transform:translateX(-50%)}
/* переключатель «смотреть как» */
.viewas{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:10px;background:var(--fg);color:var(--bg);border-radius:999px;padding:6px 6px 6px 16px;box-shadow:var(--shadow-pop);font-size:12.5px;max-width:96vw}
.viewas .lbl{font-weight:700;opacity:.75;white-space:nowrap}
.viewas .seg{display:flex;gap:2px;background:rgba(255,255,255,.08);border-radius:999px;padding:3px}
:root[data-theme="dark"] .viewas .seg{background:rgba(0,0,0,.08)}
.viewas .seg button{border:0;background:transparent;color:inherit;padding:6px 12px;border-radius:999px;font-weight:700;white-space:nowrap;opacity:.8}
.viewas .seg button.on{background:var(--bg);color:var(--fg);opacity:1}

.hl{animation:hl 1.6s ease}
@keyframes hl{0%{background:var(--warning-soft)}100%{background:transparent}}
.mobile-top{display:none}
.drawer.on ~ .viewas{left:calc((100vw - 440px)/2)}
.modal.on ~ .viewas,.modal.on ~ .who-panel{display:none}
@media (max-width:860px){

  .a4{padding:28px 22px 70px}
}

function chainUp(p){const out=[],seen=new Set([p.id]);let m=p.mgr?P(p.mgr):null,g=0;while(m&&g<50&&!seen.has(m.id)){seen.add(m.id);if(m.status==='active')out.unshift(m);m=m.mgr?P(m.mgr):null;g++}return out}
function subtree(p){const out=[],q=[p.id],seen=new Set([p.id]);while(q.length){const id=q.shift();DB.people.filter(x=>x.mgr===id&&x.company===p.company).forEach(x=>{if(!seen.has(x.id)){seen.add(x.id);out.push(x);q.push(x.id)}})}return out}
function inChainUp(v,s){if(!v||!s)return false;return subtree(v).some(x=>x.id===s.id)}

function renderDocMd(md){const ids={};let h='';for(const [t,c] of md){
 if(t==='h2'){let id=translit(c);ids[id]=(ids[id]||0)+1;if(ids[id]>1)id+='-'+ids[id];h+=`<h2 id="${id}">${esc(c)}</h2>`}
 else if(t==='p')h+=`<p>${esc(c)}</p>`;else if(t==='quote')h+=`<blockquote>${esc(c)}</blockquote>`;
 else if(t==='pre')h+=`<pre>${esc(c)}</pre>`;
 else if(t==='ul'||t==='ol')h+=`<${t}>${c.map(x=>`<li>${esc(x)}</li>`).join('')}</${t}>`;
 else if(t==='table')h+=`<div class="tw"><table><thead><tr>${c[0].map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${c.slice(1).map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
 return h}
function translit(s){const m={а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'e',ж:'zh',з:'z',и:'i',й:'y',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'h',ц:'c',ч:'ch',ш:'sh',щ:'sch',ы:'y',э:'e',ю:'yu',я:'ya'};return s.toLowerCase().split('').map(c=>m[c]??(/[a-z0-9]/.test(c)?c:'-')).join('').replace(/-+/g,'-').replace(/^-|-$/g,'')}

function palResults(){const q=norm(($('pq')||{}).value||'');if(q.length<2)return[];const out=[];
 for(const c of COMPANIES){const pr=persona();const ln=(pr.links||{})[c.id];const gate=pr.admin||!!ln;if(!gate)continue;
  DB.people.filter(p=>p.company===c.id&&(p.status==='active'||pr.admin)&&norm(`${p.last} ${p.first} ${posName(p)}`).includes(q)).slice(0,6).forEach(p=>out.push({p,c}))}return out}
function palRender(){const r=palResults();$('pres').innerHTML=r.length?`<div class="grp">Люди</div>`+r.map((x,i)=>`<div class="res ${i===palSel?'sel':''}" onclick="palGo(${i})">${avatar(x.p,28)}<div style="flex:1"><b>${esc(x.p.last)} ${esc(x.p.first)}</b><div class="muted" style="font-size:12px">${esc(posName(x.p))}${x.p.dept?' · '+esc(D(x.p.dept).name):''}</div></div><span class="badge">${x.c.name}</span></div>`).join(''):`<div class="res muted" style="cursor:default">${(($('pq')||{}).value||'').length<2?'Начните вводить — например «жуков» или «елкина»':'Никого не нашли'}</div>`}
function palKey(e){const r=palResults();if(e.key==='ArrowDown'){palSel=Math.min(palSel+1,r.length-1);palRender();e.preventDefault()}else if(e.key==='ArrowUp'){palSel=Math.max(palSel-1,0);palRender();e.preventDefault()}else if(e.key==='Enter'&&r[palSel])palGo(palSel);else if(e.key==='Escape')closeAll()}
function palGo(i){const x=palResults()[i];closeAll();S.company=x.c.id;S.tab=null;go('person/'+x.p.id);render()}

 <div class="dr-body" id="chat">${CHAT.map(m=>m.pv?previewCard(m):`<div class="msg ${m.ya?'ya':'me'}">${m.html||esc(m.t)}</div>`).join('')}</div>
 <div class="dr-sugs"><span class="muted" style="font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em">Попробуйте</span>${sugs.map(s=>`<button class="sug" onclick="runScn('${s[0]}')">${esc(s[1])}</button>`).join('')}</div>
 <div class="dr-in"><input placeholder="Напишите Юе…" onkeydown="if(event.key==='Enter'&&this.value.trim()){CHAT.push({t:this.value});CHAT.push({ya:true,t:'В мокапе я понимаю только подсказки выше 🙂'});renderYuia()}"><button class="btn primary sm">${ic('send',15)}</button></div>`;
 const ch=$('chat');ch.scrollTop=ch.scrollHeight}
function suggestions(){const s=[];if(S.company==='dot')s.push(['dot','Заведи структуру центра: директор, два отдела, шесть человек']);
 if(S.company==='rice'){if(P(personBy('rice','Попов').id).status==='active')s.push(['dismiss','Уволь Попова Илью, управляющего «Речным»']);s.push(['bulk','Залей список: 12 новых официантов в «Северный»']);if(!DB.docs.find(d=>d.subject===personBy('rice','Смирнов').id))s.push(['write','Запиши личную инструкцию Смирнову — текст во вложении'])}
 if(S.company==='mal')s.push(['bulk','Залей список: 5 новых кладовщиков']);return s}
function previewCard(m){return `<div class="pv"><div class="pv-h">${ic('eye',14)} ПРЕДПРОСМОТР — НИЧЕГО НЕ СОХРАНЕНО</div><div class="pv-b">${m.body}</div>${m.done?`<div class="pv-f"><span class="badge ok">✓ Выполнено · в истории: «${esc(persona().name)} · через Юю»</span></div>`:m.cancel?`<div class="pv-f"><span class="badge">Отменено</span></div>`:`<div class="pv-f"><button class="btn primary sm" onclick="execScn(${CHAT.indexOf(m)})">Выполнить</button><button class="btn sm" onclick="CHAT[${CHAT.indexOf(m)}].cancel=true;renderYuia()">Отмена</button></div>`}</div>`}
function say(t,html){CHAT.push({ya:true,t,html});renderYuia()}
function typing(cb){CHAT.push({ya:true,html:'<span class="typing"><i></i><i></i><i></i></span>',tmp:true});renderYuia();setTimeout(()=>{const i=CHAT.findIndex(x=>x.tmp);if(i>=0)CHAT.splice(i,1);cb()},700)}
function runScn(scn,arg){const texts={dot:'Заведи структуру центра: директор Зорина Вера, отдел «Практика» — три психолога, «Администрация» — администратор и бухгалтер',dismiss:'Уволь Попова Илью, управляющего «Речным»',bulk:S.company==='mal'?'Залей список: 5 новых кладовщиков':'Залей список: 12 новых официантов в «Северный» (таблица во вложении)',write:'Запиши личную инструкцию Смирнову Денису — текст во вложении, положи как есть'};
 if(scn==='dismiss'&&arg){const p=P(arg);if(p.last!=='Попов'){CHAT.push({t:`Что можно изменить у ${p.first} ${p.last}?`});typing(()=>say('','Скажите, что поменять: должность, отдел, руководителя, код, почту — или «уволь». Например: «переведи его в «Северный» к Кузнецовой». Перед изменением покажу предпросмотр.'));return}}
 CHAT.push({t:texts[scn]});renderYuia();
 if(!isAdmin()){typing(()=>say('У вас нет прав менять структуру и тексты — это может только администратор модуля. Я работаю вашими правами и не могу больше, чем вы.'));return}
 typing(()=>{let body='';
  if(scn==='dot')body=`<b>Будет создано в «Точке опоры»:</b><ul><li>отделы: «Практика», «Администрация»</li><li>должности: Директор центра, Психолог, Администратор, Бухгалтер</li><li>6 человек: Зорина Вера (директор, верхний уровень), 3 психолога → Зориной, администратор и бухгалтер → Зориной</li></ul><p class="muted" style="margin:6px 0 0">создано 6 · обновлено 0 · без изменений 0</p>`;
  if(scn==='dismiss'){const p=personBy('rice','Попов'),subs=DB.people.filter(x=>x.mgr===p.id&&x.status==='active');body=`<b>Попов Илья Сергеевич → уволен с 28.09.2026</b><ul><li>${subs.length} ${plural(subs.length,'прямой подчинённый перейдёт','прямых подчинённых перейдут','прямых подчинённых перейдут')} к его руководителю — <b>Орловой М. В.</b>: ${subs.map(s=>s.last+' '+s.first[0]+'.').join(', ')}</li><li>отдел Филиал «Речной» останется <b>без главы</b></li><li>карточка и инструкции сохранятся; доступ к модулю закроется на следующем запросе</li></ul>`}
  if(scn==='bulk'){const n=S.company==='mal'?5:12;body=`<b>Пакет из ${n} строк</b> — всё или ничего<ul><li>должность: ${S.company==='mal'?'Кладовщик · отдел «Склад и логистика»':'Официант · отдел «Зал», филиал «Северный»'}</li><li>руководитель: ${S.company==='mal'?'Шубин Р.':'администратор зала «Северного»'}</li><li>сопоставление по коду и ФИО (регистр и «ё» не важны) — дублей нет</li></ul><p class="muted" style="margin:6px 0 0">создано ${n} · обновлено 0 · без изменений 0 · ошибок 0</p>`}
  if(scn==='write')body=`<b>Личная инструкция · Смирнов Денис → версия 1</b><ul><li>текст кладу как есть, ничего не переписываю</li><li>оглавление: Сильные стороны · Какие задачи поручать · Что нельзя поручать · Мотивация · Как взаимодействовать</li><li>18,4 тыс. знаков · таблиц 2 · схема подчинения 1</li><li>читать смогут: сам Денис, Орлова М., Ковалёв С., администратор</li></ul>`;
  CHAT.push({pv:true,scn,body});say('Проверьте предпросмотр. Нажмите «Выполнить», и я сохраню.')})}
function execScn(i){const m=CHAT[i];m.done=true;const scn=m.scn;
 if(scn==='dot'){const C='dot';const pr=dept(C,'Практика',null),ad=dept(C,'Администрация',null);const dir=mk(C,'Зорина','Вера','Андреевна',posi(C,'Директор центра'),null,null,{email:'zorina@example.test'});pr.head=dir.id;ad.head=dir.id;
  [['Левин','Марк'],['Гаврилова','Ника'],['Ушаков','Тимофей']].forEach(([l,f])=>mk(C,l,f,f==='Ника'?'Олеговна':'Игоревич',posi(C,'Психолог'),pr.id,dir.id));mk(C,'Сизова','Лада','Павловна',posi(C,'Администратор'),ad.id,dir.id);mk(C,'Краснов','Ян','Олегович',posi(C,'Бухгалтер'),ad.id,dir.id);
  COMPANIES[2].sub='центр · 6 человек';say('Готово: 6 человек, 2 отдела. Откройте «Люди» или «Отделы» — всё уже там.');}
 if(scn==='dismiss'){const p=personBy('rice','Попов'),o=personBy('rice','Орлова');DB.people.filter(x=>x.mgr===p.id).forEach(x=>x.mgr=o.id);p.status='left';p.leftAt='28.09.2026';p.mgr=o.id;const d=DB.depts.find(x=>x.head===p.id);if(d)d.head=null;say('Готово. Подчинённые переведены к Орловой, отдел без главы. Вернуть Попова можно одной командой — «верни Попова».')}
 if(scn==='bulk'){const mal=S.company==='mal';const dd=mal?DB.depts.find(x=>x.company==='mal'&&x.name==='Склад и логистика'):(()=>{const br=DB.depts.find(x=>x.company==='rice'&&x.name==='Филиал «Северный»');return DB.depts.find(x=>x.parent===br.id&&x.name==='Зал')})();
  const names=[['Белкин','Игорь'],['Рыбакова','Злата'],['Носов','Остап'],['Фомина','Лиана'],['Ершов','Прохор'],['Панкова','Ия'],['Ларин','Вадим'],['Котова','Эмма'],['Шестаков','Марат'],['Уварова','Нелли'],['Хромов','Ефим'],['Цветкова','Инна']];
  const n=mal?5:12;for(let i=0;i<n;i++){const [l,f]=names[i];mk(S.company,l,f,l.endsWith('а')?'Ивановна':'Иванович',posi(S.company,mal?'Кладовщик':'Официант'),dd.id,dd.head)}say(`Готово: создано ${n}. Повторная заливка того же списка ничего не задвоит.`)}
 if(scn==='write'){const s=personBy('rice','Смирнов');DB.docs.push({id:DB.docs.length+1,company:'rice',kind:'personal',subject:s.id,src:null,gen:true,versions:[{n:1,date:'28.09.2026',by:persona().name,agent:true}]});say('Готово: версия 1. Инструкция уже на карточке Смирнова, вкладка «Личная».')}
 renderYuia();renderSidebar();renderMain()}

/* ---------- «смотреть как» ---------- */
function renderViewAs(){const p=persona();
 $('viewas').innerHTML=`<span class="lbl">Смотреть как</span><div class="seg">${PERSONAS.map(x=>`<button class="${x.id===S.persona?'on':''}" onclick="setPersona('${x.id}')">${x.label}</button>`).join('')}</div><button class="info" onclick="$('whoPanel').classList.toggle('on')" title="Что видит эта роль">?</button>`;
 $('whoPanel').innerHTML=`<div class="who">${avatar({id:9,last:p.name.split(' ')[1],first:p.name.split(' ')[0]},36)}<div><b>${esc(p.name)}</b><div class="muted" style="font-size:12.5px">${esc(p.role)}</div></div></div><ul>${p.sees.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`}
function setPersona(id){S.persona=id;S.tab=null;S.showLeft=false;const p=persona();if(!(p.links||{})[S.company]&&!p.admin)S.company='rice';
 if(!p.admin)S.company='rice';const v=viewer();CHAT.length=0;$('whoPanel').classList.add('on');setTimeout(()=>$('whoPanel').classList.remove('on'),4200);
 if(v&&!p.admin)go('person/'+(p.id==='top'?personBy('rice','Орлова').id:v.id));else go('people');render()}

/* ---------- общий цикл ---------- */
function closeAll(){['overlay','palette','drawer','modal'].forEach(i=>$(i).classList.remove('on'))}
$('overlay').onclick=closeAll;
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette()}if(e.key==='Escape')closeAll()});
function toggleTheme(){const r=document.documentElement,cur=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');r.setAttribute('data-theme',cur==='dark'?'light':'dark')}
function renderMain(keepFocus){const r=route();let h;
 if(!gateOpen())h=page404();
 else if(r.a==='person')h=pagePerson(r.b);else if(r.a==='departments')h=pageDepartments();else if(r.a==='department')h=pageDepartment(r.b);
 else if(r.a==='positions')h=pagePositions();else if(r.a==='position')h=pagePosition(r.b);else if(r.a==='access')h=pageAccess();else if(r.a==='history')h=pageHistory(r.b);else h=pagePeople();
 const pos=keepFocus&&document.activeElement&&document.activeElement.id==='q'?document.activeElement.selectionStart:null;
 $('view').innerHTML=h;if(pos!==null){const q=$('q');q.focus();q.setSelectionRange(pos,pos)}}
function render(){renderSidebar();renderRail();renderMain();renderViewAs()}
let lastRoute='';window.addEventListener('hashchange',()=>{const r=location.hash;if(!r.startsWith('#/person/')||r!==lastRoute)S.tab=null;if(!r.startsWith('#/history'))S.hv=null;lastRoute=r;$('sidebar').classList.remove('open');renderSidebar();renderMain();document.querySelector('main').scrollTop=0});
if(!location.hash)location.hash='#/person/'+personBy('rice','Орлова').id;
render();
setTimeout(()=>{$('whoPanel').classList.add('on');setTimeout(()=>$('whoPanel').classList.remove('on'),5000)},600);
</script>
