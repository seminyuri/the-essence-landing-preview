<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Суть ✕ Команда — мокап v6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#7A5340;--accent-strong:#5C3D29;--accent-soft:#EADCD2;--accent-on:#fff;
  --bg:#FFFCF9;--bg-el:#FFFFFF;--bg-muted:#F5F0EA;--fg:#1A1612;--fg-muted:#5C534B;--fg-subtle:#756C64;
  --border:#E8E0D6;--border-strong:#C9BCAB;--line:#CDBFAE;
  --ok:#2F7A4F;--ok-soft:#E3F2E8;--ok-text:#1F6B41;
  --no:#B7392E;--no-soft:#F8E1DE;--no-text:#9F2C23;
  --amb:#B17A23;--amb-soft:#F8EDCF;--amb-text:#8A5D17;
  --info-soft:#DCE9F2;--info-text:#2C5678;
  --shadow-soft:0 1px 2px rgba(26,22,18,.05);--shadow-card:0 6px 20px rgba(26,22,18,.08);--shadow-pop:0 26px 64px rgba(26,22,18,.16);
  --r-md:10px;--r-lg:12px;--r-xl:14px;--r-2xl:18px;
  --font:"Manrope",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;
  --canvas:#F7F2EC;
}
:root[data-theme="dark"]{
  --accent:#E8B898;--accent-strong:#F0C9AE;--accent-soft:#3A2B20;--accent-on:#0F0D08;
  --bg:#0F0D08;--bg-el:#1A1610;--bg-muted:#211C14;--fg:#F4EFE7;--fg-muted:#B5AB9D;--fg-subtle:#948A80;
  --border:#2A241C;--border-strong:#4A4135;--line:#4A4135;--canvas:#13100B;
  --ok-soft:#1B3A26;--ok-text:#88D6AB;--no-soft:#3B1714;--no-text:#F1A19A;--amb-soft:#3A2C0E;--amb-text:#E8C271;--info-soft:#17293A;--info-text:#9CC6E6;
  --shadow-card:0 6px 20px rgba(0,0,0,.45);--shadow-pop:0 26px 70px rgba(0,0,0,.6);}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:flex;height:100vh;overflow:hidden}
/* шторка */
.sidebar{width:250px;flex:none;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--bg)}
.sb-head{padding:18px 18px 10px;font-weight:800;font-size:15px}.sb-head span{color:var(--fg-subtle);font-weight:500}
.ws{margin:4px 12px 10px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--bg-el);padding:8px 10px;display:flex;align-items:center;gap:10px;position:relative}
.ws-logo{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff}
.ws b{display:block;font-size:13px;line-height:1.2}.ws small{font-size:11.5px;color:var(--fg-subtle)}
.ws select{position:absolute;inset:0;opacity:0;cursor:pointer}
.search-btn{margin:0 12px 12px;display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--bg-muted);color:var(--fg-subtle);text-align:left}
.search-btn kbd{margin-left:auto;font-family:var(--mono);font-size:11px;background:var(--bg-el);border:1px solid var(--border);border-radius:5px;padding:0 5px}
.nav{padding:0 8px;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;text-decoration:none;color:var(--fg-muted);font-weight:600}
.nav a:hover{background:var(--bg-muted);color:var(--fg)}
.nav a.on{background:var(--accent-soft);color:var(--accent-strong)}
:root[data-theme="dark"] .nav a.on{color:var(--accent)}
.nav .count{margin-left:auto;font-size:11.5px;color:var(--fg-subtle)}
.nav-sep{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-subtle);padding:14px 10px 4px;font-weight:700}
.sb-foot{margin-top:auto;padding:12px;border-top:1px solid var(--border)}
.mock-note{font-size:11px;color:var(--amb-text);background:var(--amb-soft);border-radius:8px;padding:6px 8px;margin-bottom:10px;font-weight:600}
.ask-yuia{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:var(--r-md);background:linear-gradient(135deg,var(--accent-soft),transparent);border:1px solid var(--border);text-align:left;width:100%;font-size:12px;color:var(--fg-muted)}
.ask-yuia b{display:block;color:var(--fg);font-size:12.5px}
/* рельс */
.rail{width:56px;flex:none;border-left:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:4px;background:var(--bg)}
.rail button{width:40px;height:40px;border-radius:var(--r-md);border:0;background:transparent;display:grid;place-items:center;color:var(--fg-subtle);position:relative}
.rail button:hover{background:var(--bg-muted);color:var(--fg)}
.rail button.on{background:var(--accent);color:var(--accent-on)}
.rail button.yu{color:var(--accent)}
.rail .tip{position:absolute;right:48px;white-space:nowrap;background:var(--fg);color:var(--bg);font-size:12px;padding:3px 8px;border-radius:6px;opacity:0;pointer-events:none;transition:.15s;z-index:5}
.rail button:hover .tip{opacity:1}
.rail .sp{flex:1}
main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
.scroll{flex:1;overflow-y:auto}
.page{max-width:1180px;margin:0 auto;padding:26px 32px 120px}
/* аватар с фото */
.av{position:relative;border-radius:50%;overflow:hidden;display:inline-grid;place-items:center;color:#fff;font-weight:800;flex:none;box-shadow:0 0 0 2px var(--bg-el)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av.left{filter:grayscale(1);opacity:.6}
/* дерево */
.tb{display:flex;align-items:center;gap:8px;padding:12px 18px;border-bottom:1px solid var(--border);background:var(--bg);flex-wrap:wrap;z-index:3}
.tb h1{margin:0 8px 0 0;font-size:20px;letter-spacing:-.02em}
.tb .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--bg-el);font-weight:600;font-size:13px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--border-strong)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-on)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.icon{padding:7px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;background:var(--bg-el)}
.seg button{border:0;background:transparent;padding:6px 11px;font-weight:700;font-size:12.5px;color:var(--fg-subtle)}
.seg button.on{background:var(--accent-soft);color:var(--accent-strong)}
.find{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--bg-el);border-radius:var(--r-md);padding:6px 10px;min-width:230px}
.find input{border:0;outline:0;background:transparent;font:inherit;color:inherit;width:100%}
.canvas{flex:1;position:relative;overflow:hidden;background:var(--canvas);background-image:radial-gradient(var(--border) 1px,transparent 1px);background-size:22px 22px;cursor:grab;touch-action:none}
.canvas.drag{cursor:grabbing}
.stage{position:absolute;left:0;top:0;transform-origin:0 0;padding:40px 60px 160px}
.stage.anim{transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.legend{flex-basis:100%;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px}
.legend span{display:flex;align-items:center;gap:8px;color:var(--fg-muted)}.legend i{width:10px;height:10px;border-radius:3px}
.zoom{position:absolute;right:14px;bottom:78px;display:flex;flex-direction:column;background:var(--bg-el);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-soft);z-index:2}
.zoom button{border:0;background:transparent;width:36px;height:34px;font-weight:800;font-size:16px}
.zoom button:hover{background:var(--bg-muted)}
.oc ul{padding-top:26px;position:relative;display:flex;justify-content:center;margin:0;padding-left:0}
.oc li{list-style:none;position:relative;padding:26px 8px 0;display:flex;flex-direction:column;align-items:center}
.oc li::before,.oc li::after{content:'';position:absolute;top:0;right:50%;border-top:2px solid var(--line);width:50%;height:26px}
.oc li::after{right:auto;left:50%;border-left:2px solid var(--line)}
.oc li:only-child::before,.oc li:only-child::after{display:none}
.oc li:only-child{padding-top:0}
.oc li:first-child::before,.oc li:last-child::after{border:0 none}
.oc li:last-child::before{border-right:2px solid var(--line);border-radius:0 10px 0 0}
.oc li:first-child::after{border-radius:10px 0 0 0}
.oc ul ul::before{content:'';position:absolute;top:0;left:50%;border-left:2px solid var(--line);height:26px}
.oc>ul{padding-top:0}
.node{position:relative;width:196px;background:var(--bg-el);border:1px solid var(--border);border-radius:16px;padding:14px 12px 12px;box-shadow:var(--shadow-soft);text-align:center;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s}
.node::before{content:'';position:absolute;left:12px;right:12px;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--dc,var(--border-strong))}
.node:hover{transform:translateY(-2px);box-shadow:var(--shadow-card);border-color:var(--dc,var(--accent))}
.node .nm{font-weight:800;font-size:13.5px;line-height:1.25;margin-top:8px}
.node .rl{font-size:12px;color:var(--fg-subtle);line-height:1.3;margin-top:2px}
.node .dp{font-size:11px;color:var(--fg-subtle);margin-top:4px;display:inline-flex;gap:5px;align-items:center}
.node .dp i{width:7px;height:7px;border-radius:2px;background:var(--dc)}
.node.path{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in oklch,var(--accent) 22%,transparent)}
.node.me{border-color:var(--ok)}
.node.pulse{animation:pulse 1.8s ease 2}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in oklch,var(--accent) 55%,transparent)}100%{box-shadow:0 0 0 18px transparent}}
.node.new{animation:pop .5s ease both}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.node.left{opacity:.55}
.tag{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;white-space:nowrap;box-shadow:var(--shadow-soft)}
.tag.me{background:var(--ok);color:#fff}
.tag.pair{background:linear-gradient(135deg,#C9906F,#7A5340);color:#fff}
.tog{margin-top:10px;border:1px solid var(--border);background:var(--bg-muted);border-radius:999px;padding:2px 10px 2px 4px;font-size:11.5px;font-weight:700;color:var(--fg-muted);display:inline-flex;align-items:center;gap:6px}
.tog:hover{border-color:var(--accent);color:var(--fg)}
.stackav{display:inline-flex}.stackav .av{margin-left:-6px;box-shadow:0 0 0 2px var(--bg-muted)}.stackav .av:first-child{margin-left:0}
.team{width:220px;background:var(--bg-el);border:1px solid var(--border);border-radius:14px;padding:6px;box-shadow:var(--shadow-soft);text-align:left}
.team .ti{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:9px;cursor:pointer}
.team .ti:hover{background:var(--bg-muted)}
.team .ti b{display:block;font-size:12.5px;line-height:1.2}.team .ti small{font-size:11px;color:var(--fg-subtle)}
.team .more{font-size:12px;font-weight:700;color:var(--accent);padding:5px 8px;cursor:pointer}
.team-h{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-subtle);padding:4px 6px 2px}
/* боковой лист профиля */
.sheet{position:absolute;top:0;right:0;height:100%;width:min(500px,100%);background:var(--bg);border-left:1px solid var(--border);box-shadow:var(--shadow-pop);transform:translateX(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:6;display:flex;flex-direction:column}
.sheet.on{transform:none}
.sh-top{position:relative;padding:22px 20px 16px;background:linear-gradient(180deg,color-mix(in oklch,var(--dc,var(--accent)) 16%,var(--bg)),var(--bg));border-bottom:1px solid var(--border)}
.sh-close{position:absolute;right:12px;top:12px}
.sh-hero{display:flex;gap:16px;align-items:center}
.sh-hero h2{margin:0;font-size:21px;letter-spacing:-.02em;line-height:1.2}
.sh-hero .rl{color:var(--fg-muted);font-weight:600;margin-top:3px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--bg-el);border:1px solid var(--border);font-size:12px;font-weight:700;color:var(--fg-muted);text-decoration:none;cursor:pointer}
.chip i{width:8px;height:8px;border-radius:2px;background:var(--dc)}
.sh-body{flex:1;overflow-y:auto;padding:16px 20px 120px;display:flex;flex-direction:column;gap:14px}
.sec{background:var(--bg-el);border:1px solid var(--border);border-radius:var(--r-xl);padding:14px}
.sec-h{display:flex;align-items:center;gap:8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-subtle);font-weight:800;margin:0 0 10px}
.sec-h .sp{flex:1}
.for-you{border:0;background:linear-gradient(135deg,#8A5E47,#5C3D29);color:#FFF7F0;box-shadow:var(--shadow-card)}
.for-you .sec-h{color:#F3D9C8}
.for-you .lk{font-size:10.5px;background:rgba(255,255,255,.16);padding:2px 8px;border-radius:999px;text-transform:none;letter-spacing:0}
.fy-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fy-cols div{background:rgba(255,255,255,.09);border-radius:12px;padding:10px}
.fy-cols h4{margin:0 0 6px;font-size:12.5px}
.fy-cols ul{margin:0;padding-left:16px;font-size:12.5px;line-height:1.45}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.45}
.tile h4{margin:0 0 6px;font-size:12.5px;display:flex;gap:6px;align-items:center}
.tile ul{margin:0;padding-left:0;list-style:none}.tile li{margin:3px 0;display:flex;gap:6px}.tile li::before{content:attr(data-m);font-weight:800}
.tile.ok{background:var(--ok-soft);color:var(--ok-text)}.tile.no{background:var(--no-soft);color:var(--no-text)}.tile.amb{background:var(--amb-soft);color:var(--amb-text)}.tile.inf{background:var(--info-soft);color:var(--info-text)}
.tile.wide{grid-column:1/-1}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{background:var(--bg-muted);border:1px solid var(--border);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600}
.pill::before{content:'✦ ';color:var(--accent)}
.energy{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-items:end;height:112px;margin-top:4px}
.energy div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.energy b{width:100%;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,var(--c1),var(--c2))}
.energy small{font-size:11px;color:var(--fg-subtle);text-align:center;line-height:1.2}
.steps{display:flex;flex-direction:column;gap:6px;counter-reset:s}
.steps div{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.steps div::before{counter-increment:s;content:counter(s);width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent-strong);font-weight:800;font-size:12px;display:grid;place-items:center;flex:none}
.cadence{display:flex;flex-direction:column;gap:6px}
.cad{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;padding:8px 10px;border-radius:10px;background:var(--bg-muted)}
.cad span{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);width:110px;flex:none;padding-top:1px}
.mini-chain{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mini-chain a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:12.5px;font-weight:700;background:var(--bg-muted);padding:3px 10px 3px 3px;border-radius:999px;cursor:pointer}
.mini-chain .ar{color:var(--fg-subtle)}
.doclink{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--border);border-radius:12px;cursor:pointer;background:var(--bg)}
.doclink:hover{border-color:var(--accent)}
.doclink b{font-size:13px}.doclink small{display:block;font-size:11.5px;color:var(--fg-subtle)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--bg-muted);color:var(--fg-muted);white-space:nowrap}
.badge.acc{background:var(--accent-soft);color:var(--accent-strong)}.badge.no{background:var(--no-soft);color:var(--no-text)}.badge.ok{background:var(--ok-soft);color:var(--ok-text)}
.hint{font-size:12px;color:var(--fg-subtle)}
/* галерея людей */
.gal-h{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.gal-h h3{margin:0;font-size:15px}.gal-h i{width:12px;height:12px;border-radius:4px;background:var(--dc)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.face{background:var(--bg-el);border:1px solid var(--border);border-radius:16px;padding:16px 12px 12px;text-align:center;cursor:pointer;transition:.15s;position:relative}
.face:hover{transform:translateY(-2px);box-shadow:var(--shadow-card);border-color:var(--dc)}
.face b{display:block;font-size:13.5px;margin-top:8px;line-height:1.25}.face small{display:block;font-size:12px;color:var(--fg-subtle);margin-top:2px}
.face .mg{font-size:11px;color:var(--fg-subtle);margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fchip{border:1px solid var(--border);background:var(--bg-el);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:700;color:var(--fg-muted);display:inline-flex;gap:6px;align-items:center}
.fchip i{width:8px;height:8px;border-radius:2px;background:var(--dc)}
.fchip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
/* документ целиком */
.overlay{position:fixed;inset:0;background:rgba(26,22,18,.38);backdrop-filter:blur(2px);display:none;z-index:40}.overlay.on{display:block}
.modal{position:fixed;inset:5vh 0 auto;margin:auto;width:min(860px,94vw);max-height:90vh;overflow:auto;background:var(--bg);border-radius:var(--r-2xl);box-shadow:var(--shadow-pop);z-index:50;display:none}
.modal.on{display:block}
.modal-h{position:sticky;top:0;display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--bg-el);border-bottom:1px solid var(--border);z-index:2}
.doc{font-size:15px;line-height:1.65;padding:24px 34px 34px;max-width:760px}
.doc h2{font-size:18px;margin:24px 0 8px}.doc h2:first-child{margin-top:0}
.doc p{margin:0 0 12px}.doc ul,.doc ol{margin:0 0 12px;padding-left:22px}
.doc blockquote{margin:0 0 16px;padding:12px 16px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0}
.doc pre{font-family:var(--mono);font-size:12.5px;line-height:1.45;background:var(--bg-muted);border:1px solid var(--border);border-radius:10px;padding:14px;overflow-x:auto;white-space:pre}
.doc table{border-collapse:collapse;width:100%;font-size:13.5px;margin-bottom:14px}.doc th,.doc td{padding:7px 10px;border-bottom:1px solid var(--border);text-align:left}.doc th{background:var(--bg-muted)}
.wm{margin:0 34px 24px;padding-top:8px;border-top:1px solid var(--border);font-size:11.5px;color:var(--fg-subtle);display:flex;justify-content:space-between}
/* палитра, Юя, тосты, «смотреть как» */
.palette{position:fixed;top:12vh;left:50%;transform:translateX(-50%);width:min(620px,92vw);background:var(--bg-el);border:1px solid var(--border);border-radius:var(--r-2xl);box-shadow:var(--shadow-pop);z-index:50;display:none;overflow:hidden}
.palette.on{display:block}
.palette .pi{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.palette input{flex:1;border:0;outline:0;background:transparent;font:inherit;font-size:16px;color:inherit}

}

/* ===== v3 ===== */
body.full .sidebar,body.full .rail{display:none}
.tb-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%}
.lvl{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-subtle);font-weight:700}
.legend span{cursor:pointer;padding:2px 8px;border-radius:999px;border:1px solid transparent}
.legend span:hover{border-color:var(--border)}
.legend span.on{background:var(--fg);color:var(--bg)}
.node.dim,.team.dim,.vac.dim{opacity:.22;filter:grayscale(.6)}
.oc.compact .node{width:150px;padding:10px 8px 8px}
.oc.compact .node .av{width:38px!important;height:38px!important}
.oc.compact .node .dp,.oc.compact .node .rl{display:none}
.oc.compact .node .nm{font-size:12.5px;margin-top:6px}
.badges{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:3px;align-items:flex-end}
.nb{font-size:10px;font-weight:800;padding:1px 6px;border-radius:999px;white-space:nowrap}
.nb.new{background:var(--info-soft);color:var(--info-text)}
.nb.x{background:var(--bg-muted);color:var(--fg-muted);border:1px solid var(--border)}
.en{position:absolute;top:8px;left:8px;font-size:10px;font-weight:800;padding:1px 6px;border-radius:999px}
.en.hi{background:var(--ok-soft);color:var(--ok-text)}.en.mid{background:var(--amb-soft);color:var(--amb-text)}.en.lo{background:var(--no-soft);color:var(--no-text)}
.vac{width:196px;border:2px dashed var(--border-strong);border-radius:16px;padding:14px 12px;text-align:center;background:color-mix(in oklch,var(--bg-el) 60%,transparent);color:var(--fg-muted);cursor:pointer}
.vac:hover{border-color:var(--accent);color:var(--fg)}
.vac .vi{width:52px;height:52px;border-radius:50%;border:2px dashed var(--border-strong);display:grid;place-items:center;margin:0 auto 8px;font-size:22px}
.vac b{display:block;color:var(--fg);font-size:13px}.vac small{font-size:11.5px}
.focusbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 18px;background:var(--accent-soft);border-bottom:1px solid var(--border);font-size:12.5px;font-weight:600}
.focusbar a{cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--border);border-radius:5px;padding:0 4px;background:var(--bg-el);color:var(--fg-subtle)}
/* обзор холдинга */
.hold-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:18px}
.co{background:var(--bg-el);border:1px solid var(--border);border-radius:20px;padding:18px;cursor:pointer;transition:.15s;position:relative;overflow:hidden}
.co::before{content:'';position:absolute;inset:0 0 auto 0;height:4px;background:var(--cc)}
.co:hover{transform:translateY(-2px);box-shadow:var(--shadow-card);border-color:var(--cc)}
.co-h{display:flex;align-items:center;gap:12px}
.co-logo{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--cc)}
.co-h b{font-size:17px;display:block}.co-h small{color:var(--fg-subtle)}
.co-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.co-stats div{background:var(--bg-muted);border-radius:12px;padding:8px 10px}
.co-stats b{display:block;font-size:18px}.co-stats span{font-size:11.5px;color:var(--fg-subtle)}
.co-depts{display:flex;flex-wrap:wrap;gap:6px}
.co-depts span{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--bg-muted);display:inline-flex;gap:6px;align-items:center}
.co-depts i{width:7px;height:7px;border-radius:2px;background:var(--dc)}
.co-f{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--border);font-size:12.5px;color:var(--fg-muted)}
.hmap{margin-top:26px;background:var(--canvas);background-image:radial-gradient(var(--border) 1px,transparent 1px);background-size:22px 22px;border:1px solid var(--border);border-radius:20px;padding:26px 10px;overflow-x:auto}
.cnode{width:210px;background:var(--bg-el);border:1px solid var(--border);border-radius:16px;padding:12px;text-align:left;cursor:pointer;display:flex;gap:10px;align-items:center;position:relative}
.cnode::before{content:'';position:absolute;left:12px;right:12px;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--cc)}
.cnode:hover{box-shadow:var(--shadow-card);border-color:var(--cc)}
.cnode b{display:block;font-size:13.5px}.cnode small{font-size:11.5px;color:var(--fg-subtle)}
.shared{margin-top:22px}
.shared-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:14px;background:var(--bg-el);margin-bottom:8px;flex-wrap:wrap}
.shared-row b{font-size:13.5px}
.cochip{display:inline-flex;gap:6px;align-items:center;padding:3px 10px;border-radius:999px;border:1px solid var(--border);font-size:12px;font-weight:700;cursor:pointer;background:var(--bg)}
.cochip i{width:8px;height:8px;border-radius:3px;background:var(--cc)}
.cochip:hover{border-color:var(--cc)}
/* отделы */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin-top:16px}
.dcard{background:var(--bg-el);border:1px solid var(--border);border-radius:18px;overflow:hidden;cursor:pointer;transition:.15s}
.dcard:hover{box-shadow:var(--shadow-card);border-color:var(--dc)}

.dcard-b{padding:12px 16px 16px}

.sub-d span{margin-left:auto;font-size:12px;color:var(--fg-subtle)}
/* моя команда */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;margin-top:16px}
.tcard{background:var(--bg-el);border:1px solid var(--border);border-radius:18px;padding:14px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:10px}

.tcard-h{display:flex;gap:12px;align-items:center}
.tcard-h b{display:block;font-size:14px}.tcard-h small{color:var(--fg-subtle);font-size:12px}
.tline{font-size:12.5px;display:flex;gap:6px;align-items:flex-start;padding:6px 8px;border-radius:10px}

.sumbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.sumbar div{background:var(--bg-el);border:1px solid var(--border);border-radius:14px;padding:10px 14px;min-width:150px}
.sumbar b{font-size:20px;display:block}.sumbar span{font-size:12px;color:var(--fg-subtle)}
/* лента */
.feed{margin-top:16px;display:flex;flex-direction:column;gap:0}
.fitem{display:flex;gap:14px;padding:12px 0;border-top:1px solid var(--border);align-items:flex-start}
.fitem:first-child{border-top:0}
.fdot{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:15px}
.fdot.in{background:var(--ok-soft)}.fdot.out{background:var(--no-soft)}.fdot.move{background:var(--info-soft)}.fdot.doc{background:var(--accent-soft)}.fdot.vac{background:var(--amb-soft)}
.fitem b{font-size:13.5px}.fitem .hint{margin-top:2px}
/* профиль: якоря, «сейчас», кто видит, факты */
.anchors{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.anchors a{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--bg-el);border:1px solid var(--border);cursor:pointer;text-decoration:none}

.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}

.now.hi{background:var(--ok-soft);color:var(--ok-text)}.now.mid{background:var(--amb-soft);color:var(--amb-text)}.now.lo{background:var(--no-soft);color:var(--no-text)}

.energy div.cur b{outline:3px solid var(--fg);outline-offset:2px}
.who-sees{position:relative;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--bg-muted);color:var(--fg-subtle);font-size:11px;cursor:help;text-transform:none;letter-spacing:0}

.for-you .who-sees{background:rgba(255,255,255,.18);color:#fff}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px}
