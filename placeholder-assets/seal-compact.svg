<!-- Суть — Compact Seal -->
<svg viewBox="15 15 970 970" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 3 RING GRADIENTS -->
    <radialGradient id="gO-c" cx="47%" cy="33%" r="60%">
      <stop offset="0%" stop-color="#F0D0B0"/>
      <stop offset="30%" stop-color="#DDB088"/>
      <stop offset="60%" stop-color="#C8946C"/>
      <stop offset="100%" stop-color="#906848"/>
    </radialGradient>
    <radialGradient id="gM-c" cx="47%" cy="36%" r="55%">
      <stop offset="0%" stop-color="#E0C0A0"/>
      <stop offset="50%" stop-color="#C8A078"/>
      <stop offset="100%" stop-color="#907058"/>
    </radialGradient>
    <radialGradient id="gI-c" cx="47%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#E8C8A8"/>
      <stop offset="45%" stop-color="#C8A078"/>
      <stop offset="100%" stop-color="#907058"/>
    </radialGradient>

  </defs>

  <!-- ═══ 3 RINGS ═══ -->
  <circle cx="500" cy="500" r="470" fill="none" stroke="url(#gO-c)" stroke-width="30" opacity=".92"/>
  <circle cx="500" cy="500" r="437.312" fill="none" stroke="url(#gM-c)" stroke-width="3" opacity=".45"/>
  <circle cx="500" cy="500" r="418.124" fill="none" stroke="url(#gI-c)" stroke-width="3" opacity=".48"/>

  <!-- ═══ EYE — pure φ-cascade, 5 steps ═══ -->

  <!-- IRIS — flush with inner ring -->
  <circle cx="500" cy="500" r="392.124"
          fill="#18100A" stroke="#E0A898" stroke-width="52" opacity=".75"/>

  <!-- SCLERA — 392.124 / φ = 242.34 -->
  <circle cx="500" cy="500" r="242.34" fill="#F5DCC0" opacity=".96"/>

  <!-- PUPIL — 242.34 / φ = 149.77 -->
  <circle cx="500" cy="500" r="149.77" fill="#100A06" opacity=".99"/>

  <!-- Warm halo · r=92.56 -->
  <circle cx="417.6" cy="417.6" r="92.56" fill="#FFE0C0" opacity=".3"/>

  <!-- White spark · r=44.89 -->
  <circle cx="422.7" cy="422.7" r="44.89" fill="#fff" opacity=".6"/>
</svg>
